[project]
name = "langchainupdated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2",
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.2",
    "litellm>=1.105.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
langchainupdated = "langchainupdated:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
